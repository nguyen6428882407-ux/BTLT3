<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopVN - Đăng ký tài khoản</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; background: #eef1f5; color: #222; }
  main { display: flex; justify-content: center; padding: 30px 15px; }
  section {
    background: #fff;
    max-width: 560px;
    width: 100%;
    border-radius: 10px;
    padding: 26px 30px 30px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.08);
  }
  h1 { text-align: center; font-size: 20px; color: #1d4ed8; margin-top: 0; }
  fieldset {
    border: 1px solid #dbeafe;
    border-radius: 8px;
    margin-bottom: 18px;
    padding: 14px 16px 16px;
  }
  legend { font-weight: 600; color: #1d4ed8; padding: 0 6px; font-size: 13.5px; }
  label { display: block; font-size: 12.5px; color: #555; margin: 10px 0 4px; }
  input[type="text"], input[type="email"], input[type="password"],
  input[type="tel"], input[type="url"], input[type="number"],
  input[type="date"], input[type="search"], input[type="file"] {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    font-size: 13px;
  }
  input[type="range"] { width: 100%; }
  input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 2px #bfdbfe; }
  .row { display: flex; align-items: center; gap: 6px; margin: 6px 0; }
  .row label { margin: 0; font-size: 13px; color: #333; }
  .inline-group { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 8px; }
  .checks { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px; }
  .actions { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
  input[type="submit"], input[type="reset"] {
    padding: 10px 22px;
    border: none;
    border-radius: 20px;
    font-size: 13.5px;
    cursor: pointer;
  }
  input[type="submit"] { background: #2563eb; color: #fff; }
  input[type="submit"]:hover { background: #1d4ed8; }
  input[type="reset"] { background: #e5e7eb; color: #333; }
  input[type="reset"]:hover { background: #d1d5db; }
  input[type="color"] { width: 50px; height: 32px; border: none; padding: 0; }
  .range-val { font-size: 12px; color: #2563eb; font-weight: 600; }
</style>
</head>
<body>

<main>
  <section>
    <h1>Đăng ký tài khoản mới</h1>

    <form action="xu_ly_dangky.php" method="POST" enctype="multipart/form-data" name="formDangKy" id="formDangKy">

      <fieldset>
        <legend>Thông tin cơ bản</legend>

        <label for="hoten">Họ và tên:</label>
        <input type="text" name="hoten" id="hoten" placeholder="Nguyễn Văn An" required maxlength="100">

        <label for="email">Email:</label>
        <input type="email" name="email" id="email" placeholder="example@gmail.com" required>

        <label for="matkhau">Mật khẩu:</label>
        <input type="password" name="matkhau" id="matkhau" minlength="8" required>

        <label for="sdt">Số điện thoại:</label>
        <input type="tel" name="sdt" id="sdt" pattern="[0-9]{10}" placeholder="0901234567">
      </fieldset>

      <fieldset>
        <legend>Thông tin cá nhân</legend>

        <label for="tuoi">Tuổi:</label>
        <input type="number" name="tuoi" id="tuoi" min="16" max="99" step="1" value="18">

        <label for="ngaysinh">Ngày sinh:</label>
        <input type="date" name="ngaysinh" id="ngaysinh" min="1950-01-01" max="2010-12-31">

        <label>Giới tính:</label>
        <div class="inline-group">
          <div class="row">
            <input type="radio" name="gioitinh" id="gt_nam" value="nam">
            <label for="gt_nam">Nam</label>
          </div>
          <div class="row">
            <input type="radio" name="gioitinh" id="gt_nu" value="nu" checked>
            <label for="gt_nu">Nữ</label>
          </div>
          <div class="row">
            <input type="radio" name="gioitinh" id="gt_khac" value="khac">
            <label for="gt_khac">Khác</label>
          </div>
        </div>

        <label for="mauua">Màu yêu thích:</label>
        <input type="color" name="mauua" id="mauua" value="#FF6B6B">
      </fieldset>

      <fieldset>
        <legend>Sở thích &amp; Cài đặt</legend>

        <label for="soikim">Tìm kiếm sở thích:</label>
        <input type="search" name="soikim" id="soikim" placeholder="Ví dụ: đọc sách, chơi game...">

        <label for="chitieu">Mức chi tiêu/tháng (VNĐ): <span class="range-val" id="chitieuVal">5.000.000</span></label>
        <input type="range" name="chitieu" id="chitieu" min="0" max="50000000" step="500000" value="5000000">

        <label>Sở thích (chọn nhiều):</label>
        <div class="checks">
          <div class="row">
            <input type="checkbox" name="st_docsinh" id="st_doc" value="doc" checked>
            <label for="st_doc">Đọc sách</label>
          </div>
          <div class="row">
            <input type="checkbox" name="st_game" id="st_game" value="game">
            <label for="st_game">Chơi game</label>
          </div>
          <div class="row">
            <input type="checkbox" name="st_du_lich" id="st_dulich" value="dulich" checked>
            <label for="st_dulich">Du lịch</label>
          </div>
        </div>

        <label for="website">Website cá nhân:</label>
        <input type="url" name="website" id="website" placeholder="https://example.com">

        <label for="avatar">Ảnh đại diện:</label>
        <input type="file" name="avatar" id="avatar" accept="image/png, image/jpeg">
      </fieldset>

      <div class="actions">
        <input type="submit" value="Đăng ký ngay">
        <input type="reset" value="Nhập lại">
      </div>

    </form>
  </section>
</main>

<script>
  // Cập nhật số hiển thị mức chi tiêu khi kéo thanh trượt
  const chitieu = document.getElementById('chitieu');
  const chitieuVal = document.getElementById('chitieuVal');
  chitieu.addEventListener('input', () => {
    chitieuVal.textContent = Number(chitieu.value).toLocaleString('vi-VN');
  });
</script>

</body>
</html>
